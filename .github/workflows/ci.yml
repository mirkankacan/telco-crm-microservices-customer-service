name: CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore TelcoCrmMicroservices.slnx
        env:
          GH_PACKAGES_PAT: ${{ secrets.GH_PACKAGES_PAT }}

      - name: Build
        run: dotnet build TelcoCrmMicroservices.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test TelcoCrmMicroservices.slnx --configuration Release --no-build
